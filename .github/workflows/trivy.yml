name: Spunky Tensor security

on:
  workflow_call:
    inputs:
      baseline-sha:
        description: Full reviewed commit SHA of shared scripts (same pin as this workflow)
        type: string
        required: true
      image-ref:
        description: Image pinned to a platform manifest digest; empty scans source
        type: string
        default: ''
      artifact-name:
        description: Unique evidence artifact name for this call
        type: string
        default: security-source

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate baseline pin
        env:
          BASELINE_SHA: ${{ inputs.baseline-sha }}
        run: '[[ "$BASELINE_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - name: Checkout shared tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: spunkytensor/.github
          ref: ${{ inputs.baseline-sha }}
          path: baseline
          persist-credentials: false
      - name: Checkout caller source
        if: inputs.image-ref == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: false
      - name: Run standalone scan
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          target=(source "$GITHUB_WORKSPACE/source")
          if [[ -n "$IMAGE_REF" ]]; then target=(image "$IMAGE_REF"); fi
          bash baseline/scripts/scan.sh "${target[@]}" "$RUNNER_TEMP/security-reports"
      - name: Retain evidence even when the gate fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/security-reports/
          if-no-files-found: error
          retention-days: 30
