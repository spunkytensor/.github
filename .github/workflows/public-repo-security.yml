name: Spunky Tensor security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '7 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    uses: ./.github/workflows/trivy.yml
    with:
      baseline-sha: ${{ github.sha }}

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Test workflow gates and scan freshness reporting
        run: python -m unittest discover -s tests -v
      - name: Validate GitHub Actions syntax
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint "$GITHUB_WORKSPACE"/.github/workflows/*.yml

  python-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - run: python -m bandit -r scripts -lll
