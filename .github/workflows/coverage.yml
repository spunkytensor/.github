name: Public-repository scan freshness

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check every active public repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_scan_freshness.py --github-org spunkytensor
